name: Monitor Alto Adige

on:
  schedule:
    # Controlli generali ogni 30 minuti (UTC)
    - cron: '*/30 * * * *'

    # Report mattina (backup)
    # UTC → Roma CEST (+2) / CET (+1)
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 9 * * *'

    # SERA dedicata: meteo di domani + farmacie di notte
    # (modo=sera → invia entrambi anche se il job */30 è in ritardo)
    # 16:00 UTC ≈ 18:00 Roma CEST | 17:00 CET
    # 17:00 UTC ≈ 19:00 Roma CEST | 18:00 CET
    # 18:00 UTC ≈ 20:00 Roma CEST | 19:00 CET
    # 19:00 UTC ≈ 21:00 Roma CEST | 20:00 CET
    # 20:00 UTC ≈ 22:00 Roma CEST | 21:00 CET
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'

    # Farmacie weekend mattina (turno diurno) – 6:30 UTC ≈ 8:30 CEST
    - cron: '30 6 * * 0,6'

  workflow_dispatch:
    inputs:
      modo:
        description: 'check | meteo | meteo_sera | viabilita | farmacie | sera'
        required: false
        default: 'check'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Action aggiornate a runtime Node.js 24 (niente più warning deprecation Node 20)
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore state
        uses: actions/cache@v5
        with:
          path: .state
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Install requests
        run: pip install requests

      - name: Determina modalità
        id: mode
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modo=${{ github.event.inputs.modo || 'check' }}" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 16 * * *" ] || [ "$SCHEDULE" = "0 17 * * *" ] || \
               [ "$SCHEDULE" = "0 18 * * *" ] || [ "$SCHEDULE" = "0 19 * * *" ] || \
               [ "$SCHEDULE" = "0 20 * * *" ]; then
            # Slot sera: meteo domani + farmacie notte
            echo "modo=sera" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "30 6 * * 0,6" ]; then
            echo "modo=farmacie" >> "$GITHUB_OUTPUT"
          else
            echo "modo=check" >> "$GITHUB_OUTPUT"
          fi
          echo "Schedule: ${SCHEDULE:-manual}"

      - name: Esegui
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBS_URL: ${{ secrets.SUBS_URL }}
          SUBS_KEY: ${{ secrets.SUBS_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python notifica.py ${{ steps.mode.outputs.modo }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .state
          key: monitor-state-${{ github.run_id }}
