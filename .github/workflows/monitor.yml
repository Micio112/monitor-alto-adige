name: Monitor Alto Adige

on:
  schedule:
    # Controlli ogni 30 minuti (emergenze + report in fascia oraria)
    - cron: '*/30 * * * *'
    # Backup mattina (se il job delle 30 min è in ritardo)
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    # Farmacie weekend sera
    - cron: '0 18 * * 0,6'
  workflow_dispatch:
    inputs:
      modo:
        description: 'check | meteo | viabilita | farmacie'
        required: false
        default: 'check'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Qui salva/ripristina la cartella .state (anti-spam e flag giornalieri)
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Install requests
        run: pip install requests

      - name: Determina modalità
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modo=${{ github.event.inputs.modo || 'check' }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 18 * * 0,6" ]; then
            echo "modo=farmacie" >> $GITHUB_OUTPUT
          else
            echo "modo=check" >> $GITHUB_OUTPUT
          fi

      - name: Esegui
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBS_URL: ${{ secrets.SUBS_URL }}
          SUBS_KEY: ${{ secrets.SUBS_KEY }}
        run: python notifica.py ${{ steps.mode.outputs.modo }}
