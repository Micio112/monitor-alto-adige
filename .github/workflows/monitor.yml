name: Monitor Alto Adige

on:
  schedule:
    # Controlli generali ogni 30 minuti (UTC)
    - cron: '*/30 * * * *'

    # Report mattina (backup)
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 9 * * *'

    # SERA dedicata: meteo di domani + farmacie di notte
    # CEST (+2): 15–21 UTC ≈ 17–23 Roma | CET (+1): 16–21 UTC ≈ 17–22 Roma
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'

    # Farmacie weekend mattina (turno diurno) – 6:30 UTC ≈ 8:30 CEST
    - cron: '30 6 * * 0,6'

  workflow_dispatch:
    inputs:
      modo:
        description: 'check | meteo | meteo_sera | viabilita | farmacie | sera'
        required: false
        default: 'check'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # GitHub cache: la chiave esatta è IMMUTABILE una volta creata.
      # Quindi salviamo sempre con run_id (chiave nuova) e ripristiniamo
      # l'ultimo stato con restore-keys sul prefisso.
      - name: Restore state
        uses: actions/cache@v5
        with:
          path: .state
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Install requests
        run: pip install requests

      - name: Determina modalità
        id: mode
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modo=${{ github.event.inputs.modo || 'check' }}" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 15 * * *" ] || [ "$SCHEDULE" = "0 16 * * *" ] || \
               [ "$SCHEDULE" = "0 17 * * *" ] || [ "$SCHEDULE" = "0 18 * * *" ] || \
               [ "$SCHEDULE" = "0 19 * * *" ] || [ "$SCHEDULE" = "0 20 * * *" ] || \
               [ "$SCHEDULE" = "0 21 * * *" ]; then
            echo "modo=sera" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "30 6 * * 0,6" ]; then
            echo "modo=farmacie" >> "$GITHUB_OUTPUT"
          else
            echo "modo=check" >> "$GITHUB_OUTPUT"
          fi
          echo "Schedule: ${SCHEDULE:-manual}"

      - name: Esegui
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBS_URL: ${{ secrets.SUBS_URL }}
          SUBS_KEY: ${{ secrets.SUBS_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python notifica.py ${{ steps.mode.outputs.modo }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .state
          key: monitor-state-${{ github.run_id }}
